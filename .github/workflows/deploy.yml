# Cloudflare Pages へデプロイする。ビルドはないので、テストが通ったらリポジトリをそのまま上げる
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: node --test
      # 手元から上げていたときと同じコマンド。--branch=main で本番 (pages.dev) に出す
      - run: pnpm dlx --allow-build=esbuild --allow-build=workerd --config.minimum-release-age=43200 wrangler@4.123.0 pages deploy . --project-name=conjugaison-seyes --branch=main
