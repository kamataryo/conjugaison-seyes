<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Conjugaison Seyès">
  <!-- セイエス罫の紙面。薄紫の横罫と、左端の赤い余白線 -->
  <rect width="32" height="32" fill="#FCFCFA"/>
  <g stroke="#C3B8DC" stroke-width="1.4"><path d="M0 8h32M0 16h32M0 24h32"/></g>
  <path d="M9 0v32" stroke="#DA6480" stroke-width="1.6"/>
  <!-- être の ê。シルコンフレックスは山形なので 16px でも潰れず、
       アクサン・テギュ (é) と違って他の言語と紛れない。
       paint-order で塗りの下に紙と同じ色の縁取りを回し、罫の上でも字形が抜けて見えるようにする -->
  <text x="16" y="24" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif"
        font-style="italic" font-size="21" fill="#1A2440"
        paint-order="stroke" stroke="#FCFCFA" stroke-width="2.4" stroke-linejoin="round">ê</text>
</svg>
