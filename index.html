<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,interactive-widget=resizes-content">
<title>Conjugaison Seyès | フランス語動詞の活用ドリル</title>
<meta name="description" content="フランス語の動詞を、人称・時制の表に書き込んで練習するドリル。">
<link rel="canonical" href="https://conjugaison-seyes.pages.dev/">
<meta name="theme-color" content="#FCFCFA" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#11131C" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">

<meta property="og:type" content="website">
<meta property="og:site_name" content="Conjugaison Seyès">
<meta property="og:locale" content="ja_JP">
<meta property="og:url" content="https://conjugaison-seyes.pages.dev/">
<meta property="og:title" content="Conjugaison Seyès | フランス語動詞の活用ドリル">
<meta property="og:description" content="人称・時制の表に書き込んで覚える、フランス語動詞の活用ドリル。">
<meta property="og:image" content="https://conjugaison-seyes.pages.dev/ogp.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="セイエス罫のノートに書かれた être の活用表">
<meta name="twitter:card" content="summary_large_image">

<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/manifest.json">
<!-- iOS のホーム画面名。title が長いので短い名前を渡す (16.4 未満は manifest の short_name を読まない) -->
<meta name="apple-mobile-web-app-title" content="Conjugaison">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600&family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..600;1,6..96,400..500&family=Zen+Kaku+Gothic+New:wght@400;500&display=swap">
<link rel="stylesheet" href="/style.css">

<p id="fallback" hidden>動詞データを読み込めませんでした。ページを再読み込みしてください。</p>
<noscript><p>このドリルは JavaScript が必要です。ブラウザの設定で有効にしてください。</p></noscript>

<main hidden>
  <header>
    <p class="eyebrow">conjugaison</p>
    <h1><button id="pin" aria-pressed="false" aria-label="この表をピン留め" title="この表をピン留め">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M12 17v5"/><path d="M9 2h6l-1 6 3 3v3H7v-3l3-3z"/>
      </svg>
    </button><span id="verb"></span><span class="pick">▾<select id="pick" aria-label="動詞を選ぶ"></select></span> <small id="meaning"></small></h1>
    <p class="gloss" id="gloss"></p>
    <p class="ex" id="ex"></p>
  </header>

  <div class="scroll-wrap">
    <div class="scroll"><table id="grid"></table></div>
    <div id="hint" hidden><span>横にスクロールできます</span></div>
  </div>

  <div class="bar">
    <button id="check">答え合わせ<small class="sub">Corriger</small></button>
    <button id="restore" hidden></button>
    <button id="reorder" hidden>並び順を戻す<small class="sub">Ordre initial</small></button>
    <button id="next">次の動詞<small class="sub">Verbe suivant</small></button>
    <ul class="pins" id="pins" hidden></ul>
    <a class="feedback" href="https://github.com/kamataryo/conjugaison-seyes/issues/new"
       target="_blank" rel="noopener">Signaler un problème</a>
  </div>
  <!-- 今回のリリースでは出さない。app.js のリスナと対で戻す
  <button id="reset-score">スコアをリセット</button>
  -->

</main>

<script type="module" src="app.js"></script>
